name: Release
on:
  push:
    tags:
    - 'v*'
jobs:
  activate:
    if: github.repository == 'asciidoctor-contrib/asciidoctor-mathematical'
    runs-on: ubuntu-26.04
    steps:
    - run: echo ok go
  build:
    needs: activate
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Install Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'
    - name: Configure Bundler
      run: bundle config --local path .bundle/gems
    - name: Install dependencies
      run: bundle --jobs 3 --retry 3
    - name: Convert sample document
      run: bundle exec asciidoctor -r asciidoctor-mathematical sample.adoc
    - name: Publish gem
      uses: dawidd6/action-publish-gem@v1
      with:
        api_key: ${{ secrets.RUBYGEMS_API_KEY }}
